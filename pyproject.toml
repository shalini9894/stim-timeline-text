[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "stim-timeline-text"
version = "0.1.0"
description = "Tag-aware ASCII timeline diagrams for Stim circuits"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["src/stim_timeline_text"]
cmake.version = ">=3.20"
